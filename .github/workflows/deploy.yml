name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for AWS OIDC

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: commit songs are seeded by each post's creation commit

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::800703958614:role/github-actions-sandrobraidotti-com
          aws-region: us-east-1

      - name: Upload to S3
        run: |
          # Hashed assets never change: cache them forever.
          aws s3 sync dist/_astro s3://abraidotti-sandrobraidotti-com/_astro --delete \
            --cache-control "public, max-age=31536000, immutable"
          # Everything else (HTML, feeds, images) revalidates.
          aws s3 sync dist s3://abraidotti-sandrobraidotti-com --delete --exclude "_astro/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E2OFL6K1HFCZ4V --paths "/*"
